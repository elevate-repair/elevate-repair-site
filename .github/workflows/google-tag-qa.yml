name: Google Tag QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  google-tag:
    name: Denver Google tag architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Exhaustive static check across every HTML page: exactly one base
      # gtag.js loader, it must be GT-PBSXVWKK, both GT-PBSXVWKK and
      # AW-17878510208 must be configured, and G-YJVEJZRS5W must never be
      # used as a loader or a direct config.
      - name: Check Google tag architecture
        run: node tools/check-google-tag.mjs

      - name: Install Chromium for render smoke test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # Runtime check across every page: asserts the loader request and the
      # dataLayer config commands that actually fire in a browser. Third-party
      # requests are stubbed, so this needs no outbound network. Drop --all to
      # render one page per page type instead.
      - name: Render smoke test
        run: node tools/render-smoke-test.mjs --all

  design:
    name: Denver design layers and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pillow (with WebP) reads the image exports for tools/export-denver-images.py --check
      - name: Install Pillow
        run: pip install --quiet pillow

      # Hero offers, appliance strip, galleries, content photos, brand logos, area cards,
      # FAQ accordions + schema, natural headings, estimates and repair-or-replace guides:
      # every layer must match its data file and tool.
      - name: Check every design layer
        run: sh tools/run-design-tools.sh --check

      # Phone, tel links, Apps Script endpoints, forms, hidden inputs (source), gtag / onclick
      # tracking, Clarity, the thank-you page and the SEO head never change in a pull request
      # unless the guard is updated on purpose.
      - name: Invariants against the base branch
        if: github.event_name == 'pull_request'
        run: node tools/qa-denver-invariants.mjs --base=origin/${{ github.base_ref }}
